<style>
  :root{
    --paper:#E3DCC8; --card:#FBF8F1; --ink:#2B2A28; --muted:#85795F;
    --green:#2F6B4F; --green-dark:#234F3B; --price:#B33A3A; --line:#C9BFA6;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; min-height:100vh;
    display:flex; justify-content:center;
    padding:calc(28px + env(safe-area-inset-top,0px)) 14px calc(70px + env(safe-area-inset-bottom,0px));
    -webkit-tap-highlight-color:transparent;
  }
  .page{ width:100%; max-width:430px; }

  .tabs{ display:flex; gap:6px; margin-bottom:6px; }
  .tab{
    flex:1; border:1.5px solid var(--line); background:transparent; color:var(--muted);
    border-radius:8px; padding:10px 4px; font-family:'Inter'; font-weight:700; font-size:13px; cursor:pointer;
  }
  .tab[aria-selected="true"]{ background:var(--green); border-color:var(--green); color:#fff; }

  .receipt{
    position:relative; background:var(--card); border-radius:3px;
    box-shadow:0 22px 44px -24px rgba(43,42,40,.45), 0 2px 6px rgba(43,42,40,.10);
    padding:32px 22px 26px; margin-top:18px;
  }
  .tear{
    position:absolute; top:-13px; left:0; right:0; height:15px; background:var(--card);
    clip-path:polygon(0% 100%,0% 28%,6.25% 100%,12.5% 28%,18.75% 100%,25% 28%,31.25% 100%,37.5% 28%,43.75% 100%,50% 28%,56.25% 100%,62.5% 28%,68.75% 100%,75% 28%,81.25% 100%,87.5% 28%,93.75% 100%,100% 28%,100% 100%);
  }

  .eyebrow{ font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.16em; font-weight:700; color:var(--green); text-transform:uppercase; }
  .month-row{ display:flex; align-items:baseline; justify-content:space-between; margin-top:8px; }
  h1#monthLabel{ font-family:'Space Mono',monospace; font-size:21px; font-weight:700; margin:0; letter-spacing:.01em; }

  #syncBtn{ background:none; border:1.5px solid var(--line); width:34px; height:34px; border-radius:50%; font-size:16px; color:var(--green-dark); cursor:pointer; flex-shrink:0; line-height:1; }
  #syncBtn:active{ transform:scale(.93); background:var(--paper); }
  #syncBtn.spinning{ animation:spin .6s linear; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .total-block{ margin-top:20px; }
  .total-label{ font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.12em; color:var(--muted); text-transform:uppercase; }
  .total-amount{ font-family:'Space Mono',monospace; font-size:46px; font-weight:700; color:var(--price); line-height:1.05; margin-top:3px; }
  .total-sub{ font-size:12px; color:var(--muted); margin-top:4px; }
  .combined-line{ display:flex; justify-content:space-between; margin-top:12px; padding-top:10px; border-top:1px solid var(--line); font-size:13px; color:var(--muted); }
  .combined-line b{ font-family:'Space Mono',monospace; color:var(--ink); }

  .divider{ border:none; border-top:2px dashed var(--line); margin:22px 0; }

  .field{ margin-bottom:14px; }
  label.small{ display:block; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; font-weight:600; }
  .amount-wrap{ display:flex; align-items:center; border:1.5px solid var(--line); border-radius:8px; background:#fff; padding:0 12px; }
  .amount-wrap span{ font-family:'Space Mono',monospace; font-weight:700; margin-right:2px; }
  .amount-wrap input{ border:none; outline:none; flex:1; font-family:'Space Mono',monospace; font-size:20px; padding:12px 2px; background:transparent; color:var(--ink); width:100%; }

  select, input[type=date], input[type=text]{
    width:100%; border:1.5px solid var(--line); border-radius:8px; padding:12px;
    font-family:'Inter',sans-serif; font-size:16px; background:#fff; color:var(--ink);
    -webkit-appearance:none; appearance:none;
  }
  select{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9'><path d='M1 1l6 6 6-6' stroke='%2385795F' stroke-width='2' fill='none' stroke-linecap='round'/></svg>");
    background-repeat:no-repeat; background-position:right 14px center;
  }

  button[type=submit]{ width:100%; background:var(--green); color:#fff; border:none; border-radius:8px; padding:15px; font-family:'Inter'; font-weight:700; font-size:15px; letter-spacing:.02em; cursor:pointer; margin-top:6px; }
  button[type=submit]:active{ background:var(--green-dark); }
  button[type=submit]:disabled{ opacity:.55; }

  .error-msg{ color:var(--price); font-size:13px; margin-top:10px; font-weight:600; display:none; }
  .banner{ display:none; background:#F4E3D6; border:1.5px solid var(--price); color:var(--price); font-size:13px; font-weight:600; padding:10px 12px; border-radius:8px; margin-bottom:16px; }

  .entry-row{ display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px solid var(--line); }
  .entry-row:last-child{ border-bottom:none; }
  .entry-left .shop{ font-weight:600; font-size:15px; }
  .entry-left .date{ font-size:12px; color:var(--muted); margin-top:2px; font-family:'Space Mono',monospace; }
  .entry-right{ display:flex; align-items:center; gap:12px; }
  .entry-amount{ font-family:'Space Mono',monospace; font-weight:700; font-size:16px; }
  .del-btn{ border:none; background:none; color:var(--muted); font-size:12px; cursor:pointer; padding:6px 4px; font-family:'Inter'; font-weight:600; }
  .del-btn.confirm{ color:var(--price); }
  @media (prefers-reduced-motion:no-preference){ .entry-row.new{ animation:slideIn .28s ease; } }
  @keyframes slideIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }

  .empty-state{ font-size:14px; color:var(--muted); padding:18px 0; text-align:center; display:none; }

  details#prevMonths{ margin-top:18px; }
  details#prevMonths summary{ font-family:'Space Mono',monospace; font-size:12px; letter-spacing:.06em; color:var(--green-dark); cursor:pointer; list-style:none; font-weight:700; text-transform:uppercase; }
  details#prevMonths summary::-webkit-details-marker{ display:none; }
  details#prevMonths summary::before{ content:"▸ "; }
  details#prevMonths[open] summary::before{ content:"▾ "; }
  .prev-month-group{ margin-top:14px; }
  .prev-month-head{ display:flex; justify-content:space-between; font-weight:700; font-size:13px; margin-bottom:4px; }
  .prev-month-head .amt{ font-family:'Space Mono',monospace; color:var(--price); }
  .prev-entry{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--muted); padding:3px 0; }
  .prev-entry span.amt{ font-family:'Space Mono',monospace; }

  /* Combined view */
  .split{ display:flex; flex-direction:column; gap:8px; margin-top:18px; }
  .split-row{ display:flex; justify-content:space-between; align-items:baseline; font-size:14px; }
  .split-row .amt{ font-family:'Space Mono',monospace; font-weight:700; }
  .month-table{ width:100%; border-collapse:collapse; margin-top:10px; font-size:13px; }
  .month-table th{ text-align:right; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); padding:0 0 8px 8px; font-weight:600; }
  .month-table th:first-child{ text-align:left; padding-left:0; }
  .month-table td{ padding:9px 0 9px 8px; border-top:1px solid var(--line); text-align:right; font-family:'Space Mono',monospace; }
  .month-table td:first-child{ text-align:left; padding-left:0; font-family:'Inter'; font-weight:600; }
  .month-table td.tot{ font-weight:700; color:var(--price); }
  .section-title{ font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.12em; color:var(--muted); text-transform:uppercase; }

  .footer-note{ text-align:center; font-size:11.5px; color:var(--muted); margin-top:22px; line-height:1.5; }
</style>
</head>
<body>

<div class="page">
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="groceries" aria-selected="true">Groceries</button>
    <button class="tab" role="tab" data-tab="eating" aria-selected="false">Eating out</button>
    <button class="tab" role="tab" data-tab="combined" aria-selected="false">Combined</button>
  </div>

  <div class="receipt">
    <div class="tear"></div>

    <div class="eyebrow" id="eyebrow">Grocery Ledger</div>
    <div class="month-row">
      <h1 id="monthLabel">—</h1>
      <button id="syncBtn" type="button" title="Sync with shared ledger">↻</button>
    </div>

    <div class="total-block">
      <div class="total-label" id="totalLabel">Total this month</div>
      <div class="total-amount" id="totalAmount">£0</div>
      <div class="total-sub" id="syncStatus">Loading…</div>
      <div class="combined-line" id="combinedLine"><span>Combined this month</span><b id="combinedInline">£0</b></div>
    </div>

    <hr class="divider" />
    <div class="banner" id="errorBanner"></div>

    <!-- Ledger tabs -->
    <div id="ledgerView">
      <form id="entryForm">
        <div class="field">
          <label class="small" for="amountInput">Amount</label>
          <div class="amount-wrap">
            <span>£</span>
            <input type="number" id="amountInput" inputmode="numeric" min="0" step="1" placeholder="0" />
          </div>
        </div>

        <div class="field">
          <label class="small" for="shopSelect" id="shopLabel">Shop</label>
          <select id="shopSelect"></select>
        </div>

        <div class="field" id="customShopField" style="display:none;">
          <label class="small" for="customShopInput">Name</label>
          <input type="text" id="customShopInput" placeholder="Type the name" />
        </div>

        <div class="field">
          <label class="small" for="dateInput">Date</label>
          <input type="date" id="dateInput" />
        </div>

        <button type="submit" id="submitBtn">Add to ledger</button>
        <div class="error-msg" id="formError"></div>
      </form>

      <hr class="divider" />

      <div id="entriesList"></div>
      <div class="empty-state" id="emptyState">Nothing logged yet this month. Add your first one above.</div>

      <details id="prevMonths">
        <summary>Previous months</summary>
        <div id="prevList"></div>
      </details>
    </div>

    <!-- Combined tab -->
    <div id="combinedView" style="display:none;">
      <div class="section-title">This month</div>
      <div class="split">
        <div class="split-row"><span>Groceries</span><span class="amt" id="cmbGroc">£0</span></div>
        <div class="split-row"><span>Eating out</span><span class="amt" id="cmbEat">£0</span></div>
        <div class="split-row" style="border-top:1px solid var(--line);padding-top:8px;"><span><b>Combined</b></span><span class="amt" style="color:var(--price);" id="cmbTot">£0</span></div>
      </div>

      <hr class="divider" />
      <div class="section-title">Month by month</div>
      <table class="month-table">
        <thead><tr><th>Month</th><th>Groceries</th><th>Eating out</th><th>Total</th></tr></thead>
        <tbody id="monthTable"></tbody>
      </table>
    </div>

    <div class="footer-note">Shared ledger — visible to both of you.</div>
  </div>
</div>

<script>
  // ── Database ─────────────────────────────────────────────────────
  const FIREBASE_DB_URL = "https://grocery-tracking-e7651-default-rtdb.firebaseio.com";
  // ─────────────────────────────────────────────────────────────────

  // 'entries' is the original grocery data path — keep it so existing entries are preserved.
  const LEDGERS = {
    groceries: {
      path: 'entries',
      eyebrow: 'Grocery Ledger',
      pickLabel: 'Shop',
      placeholder: 'Choose a shop…',
      options: ['Tesco','Sainsbury\'s','Asda','Morrisons','Aldi','Lidl','Waitrose','Co-op','M&S Food','Iceland']
    },
    eating: {
      path: 'eatingout',
      eyebrow: 'Eating Out Ledger',
      pickLabel: 'Where / type',
      placeholder: 'Choose one…',
      options: ['Restaurant','Pub meal','Café / coffee shop','Takeaway – Indian','Takeaway – Chinese','Takeaway – Pizza','Takeaway – Fish & chips','Takeaway – Other','Fast food','Delivery app','Sandwich / lunch on the go']
    }
  };
  const OTHER = 'Other';

  const data = { groceries: [], eating: [] };
  let tab = 'groceries';

  const $ = id => document.getElementById(id);
  const monthLabelEl = $('monthLabel'), totalAmountEl = $('totalAmount'), syncStatusEl = $('syncStatus');
  const entriesListEl = $('entriesList'), emptyStateEl = $('emptyState'), prevListEl = $('prevList');
  const errorBannerEl = $('errorBanner'), formErrorEl = $('formError'), syncBtn = $('syncBtn');
  const form = $('entryForm'), amountInput = $('amountInput'), shopSelect = $('shopSelect');
  const customShopField = $('customShopField'), customShopInput = $('customShopInput'), dateInput = $('dateInput');

  const todayStr = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
  const currentMonthKey = () => todayStr().slice(0,7);
  const monthKeyOf = s => (s || '').slice(0,7);
  const monthLabelFor = key => {
    const [y,m] = key.split('-').map(Number);
    return new Date(y, m-1, 1).toLocaleString('en-GB',{month:'long'}).toUpperCase() + ' ' + y;
  };
  const monthShort = key => {
    const [y,m] = key.split('-').map(Number);
    return new Date(y, m-1, 1).toLocaleString('en-GB',{month:'short'}) + ' ' + String(y).slice(2);
  };
  const fmtDate = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString('en-GB',{day:'2-digit',month:'short'}); };
  const fmtMoney = n => '£' + Math.round(n).toLocaleString('en-GB');
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  const sumMonth = (list, mk) => list.filter(e => monthKeyOf(e.date) === mk).reduce((s,e) => s + e.amount, 0);

  const showBanner = msg => { errorBannerEl.textContent = msg; errorBannerEl.style.display = 'block'; };
  const hideBanner = () => { errorBannerEl.style.display = 'none'; };

  async function fetchLedger(key){
    const res = await fetch(`${FIREBASE_DB_URL}/${LEDGERS[key].path}.json`, {cache:'no-store'});
    if (!res.ok) throw new Error('Database request failed');
    const d = await res.json();
    return Array.isArray(d) ? d.filter(Boolean) : (d ? Object.values(d) : []);
  }
  async function persistLedger(key, list){
    const res = await fetch(`${FIREBASE_DB_URL}/${LEDGERS[key].path}.json`, {
      method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(list)
    });
    if (!res.ok) throw new Error('Database save failed');
  }

  async function loadAll(spin){
    if (spin) syncBtn.classList.add('spinning');
    try{
      const [g, e] = await Promise.all([fetchLedger('groceries'), fetchLedger('eating')]);
      data.groceries = g; data.eating = e;
      hideBanner();
      syncStatusEl.textContent = 'Synced ' + new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
    }catch(err){
      showBanner("Couldn't reach the shared ledger. Check your connection and tap ↻ to try again.");
    }
    render();
    setTimeout(() => syncBtn.classList.remove('spinning'), 600);
  }

  function setTab(t){
    tab = t;
    document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t));
    if (t !== 'combined') buildShopOptions();
    render();
  }

  function buildShopOptions(){
    const L = LEDGERS[tab];
    shopSelect.innerHTML = '';
    const first = document.createElement('option'); first.value = ''; first.textContent = L.placeholder; shopSelect.appendChild(first);
    L.options.forEach(o => { const op = document.createElement('option'); op.value = o; op.textContent = o; shopSelect.appendChild(op); });
    const other = document.createElement('option'); other.value = OTHER; other.textContent = 'Other…'; shopSelect.appendChild(other);
    $('shopLabel').textContent = L.pickLabel;
    customShopField.style.display = 'none';
    customShopInput.value = '';
    formErrorEl.style.display = 'none';
  }

  function render(){
    const mk = currentMonthKey();
    monthLabelEl.textContent = monthLabelFor(mk);

    const gTot = sumMonth(data.groceries, mk), eTot = sumMonth(data.eating, mk), cTot = gTot + eTot;
    const isCombined = tab === 'combined';

    $('ledgerView').style.display = isCombined ? 'none' : 'block';
    $('combinedView').style.display = isCombined ? 'block' : 'none';
    $('combinedLine').style.display = isCombined ? 'none' : 'flex';
    $('eyebrow').textContent = isCombined ? 'Combined Spending' : LEDGERS[tab].eyebrow;
    $('totalLabel').textContent = isCombined ? 'Combined this month' : 'Total this month';
    $('totalAmount').textContent = fmtMoney(isCombined ? cTot : (tab === 'groceries' ? gTot : eTot));
    $('combinedInline').textContent = fmtMoney(cTot);

    if (isCombined){
      $('cmbGroc').textContent = fmtMoney(gTot);
      $('cmbEat').textContent = fmtMoney(eTot);
      $('cmbTot').textContent = fmtMoney(cTot);
      renderMonthTable(mk);
      return;
    }

    const list = data[tab];
    const thisMonth = list.filter(e => monthKeyOf(e.date) === mk)
      .sort((a,b) => (b.date + (b.createdAt||'')).localeCompare(a.date + (a.createdAt||'')));
    entriesListEl.innerHTML = '';
    if (!thisMonth.length) emptyStateEl.style.display = 'block';
    else { emptyStateEl.style.display = 'none'; thisMonth.forEach(e => entriesListEl.appendChild(buildRow(e))); }
    renderPrevMonths(list, mk);
  }

  function renderMonthTable(currentKey){
    const keys = new Set([currentKey]);
    [...data.groceries, ...data.eating].forEach(e => { const k = monthKeyOf(e.date); if (k) keys.add(k); });
    const sorted = [...keys].sort().reverse();
    $('monthTable').innerHTML = sorted.map(k => {
      const g = sumMonth(data.groceries, k), e = sumMonth(data.eating, k);
      return `<tr><td>${monthShort(k)}</td><td>${fmtMoney(g)}</td><td>${fmtMoney(e)}</td><td class="tot">${fmtMoney(g+e)}</td></tr>`;
    }).join('');
  }

  function buildRow(e){
    const row = document.createElement('div');
    row.className = 'entry-row';
    row.innerHTML = `<div class="entry-left"><div class="shop"></div><div class="date"></div></div>
      <div class="entry-right"><div class="entry-amount"></div><button type="button" class="del-btn">Remove</button></div>`;
    row.querySelector('.shop').textContent = e.shop;
    row.querySelector('.date').textContent = fmtDate(e.date);
    row.querySelector('.entry-amount').textContent = fmtMoney(e.amount);
    const delBtn = row.querySelector('.del-btn');
    let timer = null;
    delBtn.addEventListener('click', () => {
      if (delBtn.classList.contains('confirm')){ clearTimeout(timer); deleteEntry(e.id); }
      else {
        delBtn.classList.add('confirm'); delBtn.textContent = 'Tap again to remove';
        timer = setTimeout(() => { delBtn.classList.remove('confirm'); delBtn.textContent = 'Remove'; }, 2800);
      }
    });
    return row;
  }

  function renderPrevMonths(list, currentKey){
    const groups = {};
    list.forEach(e => { const k = monthKeyOf(e.date); if (k && k !== currentKey) (groups[k] = groups[k] || []).push(e); });
    const keys = Object.keys(groups).sort().reverse();
    prevListEl.innerHTML = '';
    if (!keys.length){
      prevListEl.innerHTML = '<div style="font-size:12.5px;color:var(--muted);padding-top:6px;">Nothing logged before this month yet.</div>';
      return;
    }
    keys.forEach(k => {
      const items = groups[k].sort((a,b) => (b.date + (b.createdAt||'')).localeCompare(a.date + (a.createdAt||'')));
      const total = items.reduce((s,e) => s + e.amount, 0);
      const wrap = document.createElement('div'); wrap.className = 'prev-month-group';
      const head = document.createElement('div'); head.className = 'prev-month-head';
      head.innerHTML = `<span>${monthLabelFor(k)}</span><span class="amt">${fmtMoney(total)}</span>`;
      wrap.appendChild(head);
      items.forEach(e => {
        const r = document.createElement('div'); r.className = 'prev-entry';
        const l = document.createElement('span'); l.textContent = `${e.shop} — ${fmtDate(e.date)}`;
        const a = document.createElement('span'); a.className = 'amt'; a.textContent = fmtMoney(e.amount);
        r.appendChild(l); r.appendChild(a); wrap.appendChild(r);
      });
      prevListEl.appendChild(wrap);
    });
  }

  async function deleteEntry(id){
    const key = tab;
    try{
      const latest = await fetchLedger(key);
      const updated = latest.filter(e => e.id !== id);
      await persistLedger(key, updated);
      data[key] = updated;
      render();
    }catch(err){
      showBanner("Couldn't remove that — check your connection and try again.");
    }
  }

  shopSelect.addEventListener('change', () => {
    customShopField.style.display = shopSelect.value === OTHER ? 'block' : 'none';
  });

  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    formErrorEl.style.display = 'none';
    const key = tab;
    const rawAmount = parseFloat(amountInput.value);
    const shopValue = shopSelect.value === OTHER ? customShopInput.value.trim() : shopSelect.value;
    const dateValue = dateInput.value || todayStr();

    if (!rawAmount || rawAmount <= 0){ formErrorEl.textContent = 'Add an amount before saving.'; formErrorEl.style.display = 'block'; return; }
    if (!shopValue){ formErrorEl.textContent = key === 'groceries' ? 'Choose where you shopped.' : 'Choose where you ate or ordered from.'; formErrorEl.style.display = 'block'; return; }

    const entry = { id: uid(), amount: Math.round(rawAmount), shop: shopValue, date: dateValue, createdAt: new Date().toISOString() };
    const btn = $('submitBtn'); btn.disabled = true;
    try{
      const latest = await fetchLedger(key);
      latest.push(entry);
      await persistLedger(key, latest);
      data[key] = latest;
      render();
      const first = entriesListEl.firstChild; if (first) first.classList.add('new');
      amountInput.value = ''; shopSelect.value = ''; customShopInput.value = ''; customShopField.style.display = 'none';
      dateInput.value = todayStr(); amountInput.focus();
      syncStatusEl.textContent = 'Synced ' + new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
      hideBanner();
    }catch(err){
      showBanner("Couldn't save that to the shared ledger. Check your connection and try again.");
    }
    btn.disabled = false;
  });

  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
  syncBtn.addEventListener('click', () => loadAll(true));
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') loadAll(false); });

  dateInput.value = todayStr();
  buildShopOptions();
  loadAll(false);
</script>
</body>
</html>
